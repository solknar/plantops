[project]
name = "plantops"
version = "0.1.0"
description = "Multi-agent GenAI copilot for manufacturing operations: RAG over structured + unstructured data, ADK agents, LLM observability and evals."
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-adk[db]>=2.13",
  "google-genai>=2.30",
  "lancedb>=0.40",
  "pyarrow>=20",
  "numpy>=2",
  "fastapi>=0.160",
  "uvicorn>=0.30",
  "mcp>=2.3",
  "opentelemetry-sdk>=1.40",
  "python-dotenv>=1.0",
  "pypdf>=5",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]
gcp = ["opentelemetry-exporter-gcp-trace>=1.9"]

[project.scripts]
plantops = "plantops.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plantops*"]

[tool.setuptools.package-data]
"plantops.web" = ["*.html"]
"plantops.evals" = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
